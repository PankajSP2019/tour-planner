  'clear-log': async () => { if (!await confirmBox('Clear log?', 'Remove all change history for this tour?', 'Clear')) return; S.log = []; commit('Cleared the change log'); },

  // settings
  'edit-meta': () => openForm({
    title: 'Tour details', values: T, fields: tourFields(false),
    onSubmit: async v => {
      const m = cleanMeta(v); if (typeof m === 'string') return m;
      if (!m.rate) await fillRate(m);
      updateDoc(tourRef, { ...m, updatedAt: serverTimestamp() }).catch(e => toast('Could not save details (' + (e.code || e.message) + ')'));
      addLog('Edited tour details'); schedulePush();
    }
  }),
  'sync-days': () => {
    if (!T.startDate) { toast('Set a start date first'); return; }
    const have = new Set(S.days.map(d => d.date)); let added = 0;
    buildDays(T.startDate, T.endDate).forEach(d => { if (!have.has(d.date)) { S.days.push(d); added++; } });
    S.days.sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
    if (added) { commit(`Added ${added} day${added > 1 ? 's' : ''} from the tour dates`); toast(`Added ${added} day${added > 1 ? 's' : ''}`); } else toast('Every date already has a day');
  },
  'remove-member': async (_, el) => {
    const e = el.dataset.email; if (!await confirmBox('Remove person?', `${esc(e)} will lose access to this tour.`, 'Remove')) return;
    updateDoc(tourRef, { memberEmails: arrayRemove(e) }).then(() => { addLog(`Removed ${e} from the tour`); schedulePush(); }).catch(err => toast('Could not remove (' + (err.code || err.message) + ')'));
  },
  'export': () => {
    const { id, createdAt, updatedAt, ...meta } = T;
    const blob = new Blob([JSON.stringify({ app: 'tour-planner', version: 1, exportedAt: new Date().toISOString(), meta, state: S }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${slug(T.name)}-backup-${isoLocal()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    addLog('Exported a backup'); schedulePush();
  },
  'import': () => $('#importFile').click(),
  'reset-trip': async () => { if (!await confirmBox('Clear trip records?', 'This removes activity, expenses, food, requests and visit marks, and unticks checklists. The day plan, budget, contacts and notes stay.', 'Clear records')) return; const log = S.log; S = templateFrom(S, T); S.log = log; commit('Cleared trip records, kept the plan'); },
  'reset-all': async () => { if (!await confirmBox('Reset everything?', 'Every entry in this tour will be erased on all devices, including the day plan. Tour details and sharing stay.', 'Reset everything')) return; S = freshState(T); commit('Reset everything'); },
};

/* ---------- delegated events ---------- */
document.addEventListener('click', e => {
  const clock = e.target.closest('[data-clock]'); if (clock) { try { clock.showPicker(); } catch { } return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action; if (a === 'noop') return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.classList.contains('tour-tag') && e.target.closest('.dropdown')) return;
  ACT[a]?.(el.dataset.id, el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.tour-tag')) ACT['open-tour'](e.target.dataset.id); });
document.addEventListener('change', e => {
  const clock = e.target.closest('[data-clock]');
  if (clock) {
    const name = clock.dataset.clock, v = clock.value; if (!v) return; const [H, M] = v.split(':').map(Number); const b = $('#formModalBody');
    b.querySelector(`[name="${name}_h"]`).value = String(H % 12 || 12); b.querySelector(`[name="${name}_m"]`).value = String(M).padStart(2, '0'); b.querySelector(`[name="${name}_ap"]`).value = H >= 12 ? 'PM' : 'AM';
    return;
  }
  const el = e.target.closest('[data-change]'); if (!el) return;
  const k = el.dataset.change;
  if (k === 'exp-filter') { expFilter = el.value; renderActive(); }
  else if (k === 'food-filter') { foodFilter = el.value; renderActive(); }
  else if (k === 'log-filter') { logQ = el.value; renderActive(); }
  else if (k === 'cv') { CV.from = $('#cvFrom').value; CV.to = $('#cvTo').value; updateCV(); }
  else if (k === 'toggle-visit') { const p = byId(S.places, el.dataset.id); p.status = el.checked ? 'visited' : 'planned'; if (el.checked && !p.date) p.date = isoLocal(); commit(`${el.checked ? 'Visited' : 'Unmarked'} "${p.name}"`); }
  else if (k === 'toggle-req') { const r = byId(S.requests, el.dataset.id); if (!num(r.price)) { el.checked = false; toast('Add a price first'); return; } r.bought = el.checked; commit(`${el.checked ? 'Bought' : 'Unmarked'} "${r.item}"`); }
  else if (k === 'toggle-item') { const l = byId(S.lists, el.dataset.list), i = byId(l.items, el.dataset.id); i.done = el.checked; commit(`${el.checked ? 'Ticked' : 'Unticked'} "${i.text}" in "${l.name}"`); }
});
const noteLogTimers = {};
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]'); if (!el) return;
  const k = el.dataset.input;
  if (k === 'day-note') {
    const d = dayOf(el.dataset.id); if (!d) return; d.note = el.value; schedulePush();
    clearTimeout(noteLogTimers[d.id]); noteLogTimers[d.id] = setTimeout(() => { addLog(`Edited notes for ${dayLabel(d)}`); schedulePush(); }, 1500);
  } else if (k === 'cv') { CV.amt = el.value; updateCV(); }
  else if (k === 'note-search') { noteQ = el.value; $('#notesGrid').innerHTML = notesGridHTML(); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault();
  const k = f.dataset.submit;
  if (k === 'add-item') {
    const l = byId(S.lists, f.dataset.list), text = f.text.value.trim(); if (!text) return;
    l.items.push({ id: nid(), text, done: false, price: f.price ? (f.price.value.trim() === '' ? '' : num(f.price.value)) : '', cur: T.homeCur });
    commit(`Added "${text}" to "${l.name}"`);
    requestAnimationFrame(() => $(`form[data-list="${l.id}"] input[name=text]`)?.focus());
  } else if (k === 'add-member') {
    const em = f.email.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('Enter a valid email'); return; }
    if (T.memberEmails.includes(em)) { toast('Already shared with ' + em); return; }
    updateDoc(tourRef, { memberEmails: arrayUnion(em) }).then(() => { addLog(`Shared the tour with ${em}`); schedulePush(); toast('Shared with ' + em); }).catch(err => toast('Could not share (' + (err.code || err.message) + ')'));
  } else if (k === 'set-name') {
    const name = f.elements.namedItem('name').value.trim();
    updateProfile(auth.currentUser, { displayName: name }).then(() => { toast('Name saved'); renderActive(); }).catch(err => toast(err.message));
  }
});
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (!j.state || !Array.isArray(j.state.days)) throw new Error('This file is not a Tour Planner backup.');
    if (!await confirmBox('Import backup?', `Replace everything in <b>${esc(T.name)}</b> with the backup from ${esc(j.exportedAt ? new Date(j.exportedAt).toLocaleString() : 'the file')}?`, 'Replace', false)) return;
    const log = S.log; S = normalize(j.state); S.log = [...(S.log || []), ...log].slice(0, 300); commit('Imported a backup');
  } catch (err) { toast(err.message); }
});

/* ============================ AUTH ============================ */
let authMode = 'signin';
function setAuthMode(m) {
  authMode = m;
  const t = {
    signin: ['Sign in', 'Your tours sync to every device you sign in on.', 'Sign in', 'Create an account'],
    signup: ['Create account', 'One account keeps all your tours together.', 'Create account', 'I already have an account'],
    reset: ['Reset password', "We'll email you a link to set a new password.", 'Send reset link', 'Back to sign in']
  }[m];
  $('#authTitle').textContent = t[0]; $('#authSub').textContent = t[1]; $('#authBtn').textContent = t[2]; $('#authSwitch').textContent = t[3];
  $('#nameWrap').classList.toggle('hidden', m !== 'signup'); $('#passWrap').classList.toggle('hidden', m === 'reset');
  $('#keepWrap').classList.toggle('hidden', m === 'reset'); $('#authForgot').classList.toggle('hidden', m !== 'signin');
  $('#authPass').setAttribute('autocomplete', m === 'signup' ? 'new-password' : 'current-password'); $('#authErr').textContent = '';
}
function authMsg(e) {
  return ({
    'auth/invalid-credential': 'Email or password is wrong.', 'auth/wrong-password': 'Email or password is wrong.', 'auth/user-not-found': 'No account with that email. Create one instead.',
    'auth/email-already-in-use': 'That email already has an account. Sign in instead.', 'auth/weak-password': 'Use at least 6 characters for the password.',
    'auth/invalid-email': 'That email address is not valid.', 'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.',
    'auth/network-request-failed': 'No connection. Check your internet and try again.', 'auth/operation-not-allowed': 'Email sign-in is not enabled in Firebase (see setup step 2).'
  })[e.code] || e.message;
}
$('#authSwitch').addEventListener('click', e => { e.preventDefault(); setAuthMode(authMode === 'signin' ? 'signup' : 'signin'); });
$('#authForgot').addEventListener('click', e => { e.preventDefault(); setAuthMode('reset'); });
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('#authEmail').value.trim(), pass = $('#authPass').value, btn = $('#authBtn');
  $('#authErr').textContent = '';
  if (!email) { $('#authErr').textContent = 'Enter your email.'; return; }
  if (authMode !== 'reset' && pass.length < 6) { $('#authErr').textContent = 'Password needs at least 6 characters.'; return; }
  btn.disabled = true;
  try {
    if (authMode === 'reset') { await sendPasswordResetEmail(auth, email); toast('Reset link sent. Check your inbox.'); setAuthMode('signin'); return; }
    await setPersistence(auth, $('#authKeep').checked ? browserLocalPersistence : browserSessionPersistence);
    if (authMode === 'signup') {
      const c = await createUserWithEmailAndPassword(auth, email, pass);
      const name = $('#authName').value.trim(); if (name) { await updateProfile(c.user, { displayName: name }); renderHome(); }
    } else await signInWithEmailAndPassword(auth, email, pass);
  } catch (err) { $('#authErr').textContent = authMsg(err); }
  finally { btn.disabled = false; }
});

/* ============================ BOOT ============================ */
buildNav();
if (!CONFIG_OK) {
  $('#bootView').innerHTML = `<div class="auth-card" style="max-width:520px"><div class="brand"><span class="brand-mark"><i class="bi bi-compass"></i></span>Tour Planner</div>
    <h1 style="font-size:1.6rem;margin-top:20px">Connect Firebase to start</h1>
    <p class="dim">Open <b>index.html</b>, find <code>firebaseConfig</code> near the top of the script, and paste the config from your Firebase project. The setup guide walks through it step by step.</p></div>`;
} else {
  setAuthMode('signin');
  onAuthStateChanged(auth, u => {
    CU = u;
    if (!u) { closeTour(); if (unsubTours) unsubTours(); unsubTours = null; TOURS = []; toursLoaded = false; showView('authView'); return; }
    subscribeTours(); route();
  });
}
</script>
</body>
