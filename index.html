<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour Planner</title>
<meta name="theme-color" content="#0D1F22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{
  --bg:#0D1F22; --bg2:#112729; --panel:#16302F; --panel2:#1C3A38;
  --line:rgba(226,238,232,.12); --line2:rgba(226,238,232,.2);
  --text:#E2EEE8; --dim:rgba(226,238,232,.66); --faint:rgba(226,238,232,.42);
  --apricot:#F2A65A; --apricot-ink:#3B2208; --sea:#6CC4B0; --sky:#86AEDC; --rose:#E27D8C; --lime:#B7CF6E;
  --r-lg:16px; --r:11px; --r-sm:8px;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --bs-body-bg:var(--bg); --bs-body-color:var(--text); --bs-border-color:var(--line);
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*{ -webkit-tap-highlight-color:transparent; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px); }
body{ background:var(--bg); color:var(--text); font-family:var(--body); font-size:15.5px; line-height:1.55; min-height:100vh; }
h1,h2,h3,h4,h5,.display{ font-family:var(--display); letter-spacing:-.01em; }
a{ color:var(--sea); }
:focus-visible{ outline:2px solid var(--apricot)!important; outline-offset:2px; }
.dim{ color:var(--dim); } .faint{ color:var(--faint); }
.hidden{ display:none!important; }

/* ---------- buttons & inputs ---------- */
.btn{ border-radius:var(--r-sm); font-weight:600; }
.btn-accent{ background:var(--apricot); color:var(--apricot-ink); border:0; }
.btn-accent:hover,.btn-accent:focus{ background:#F7B874; color:var(--apricot-ink); }
.btn-ghost{ background:transparent; color:var(--text); border:1px solid var(--line2); }
.btn-ghost:hover{ background:var(--panel2); color:var(--text); border-color:var(--line2); }
.btn-icon{ width:34px; height:34px; padding:0; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:var(--r-sm); }
.btn-icon:hover{ color:var(--text); background:var(--panel2); }
.btn-icon.danger:hover{ color:var(--rose); border-color:var(--rose); }
.form-control,.form-select{ background-color:var(--bg2); border-color:var(--line2); color:var(--text); border-radius:var(--r-sm); }
.form-control:focus,.form-select:focus{ background-color:var(--bg2); color:var(--text); border-color:var(--apricot); box-shadow:0 0 0 .2rem rgba(242,166,90,.2); }
.form-control::placeholder{ color:var(--faint); }
.form-label{ font-size:.86rem; color:var(--dim); margin-bottom:.3rem; font-weight:600; }
.form-check-input{ background-color:var(--bg2); border-color:var(--line2); }
.form-check-input:checked{ background-color:var(--sea); border-color:var(--sea); }

/* ---------- auth ---------- */
#authView{ min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
.auth-card{ width:100%; max-width:410px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:30px 26px; }
.brand{ font-family:var(--display); font-weight:800; font-size:1.25rem; display:flex; align-items:center; gap:.55rem; }
.brand-mark{ width:34px; height:34px; border-radius:9px; background:var(--apricot); color:var(--apricot-ink); display:grid; place-items:center; font-size:1.05rem; }
.auth-card h1{ font-size:1.8rem; font-weight:800; margin:22px 0 4px; }

/* ---------- top bar ---------- */
.topbar{ position:sticky; top:0; z-index:1030; background:rgba(13,31,34,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px); }
.topbar-inner{ display:flex; align-items:center; gap:.7rem; padding:.7rem 0; }
.sync-pill{ font-size:.78rem; font-weight:600; padding:.25rem .65rem; border-radius:999px; border:1px solid var(--line2); color:var(--dim); white-space:nowrap; display:inline-flex; align-items:center; gap:.35rem; }
.sync-pill::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--faint); }
.sync-pill.ok::before{ background:var(--sea); } .sync-pill.busy::before{ background:var(--apricot); }
.sync-pill.err::before{ background:var(--rose); } .sync-pill.off::before{ background:var(--sky); }
.user-chip{ font-size:.82rem; color:var(--dim); max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ---------- dashboard / tour tags ---------- */
.home-head{ padding:34px 0 20px; }
.home-head h1{ font-size:clamp(2rem,5vw,2.9rem); font-weight:800; margin:0; line-height:1.05; }
.tour-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px; padding-bottom:50px; }
.tour-tag{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px 18px 16px 30px; cursor:pointer; overflow:hidden; transition:border-color .15s; }
.tour-tag:hover{ border-color:var(--line2); }
.tour-tag::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:10px; background:var(--tag,var(--apricot)); }
.tour-tag::after{ content:""; position:absolute; left:15px; top:20px; width:9px; height:9px; border-radius:50%; background:var(--bg); border:1px solid var(--line2); }
.tour-tag .emoji{ font-size:1.7rem; line-height:1; }
.tour-tag h3{ font-size:1.3rem; font-weight:700; margin:.55rem 0 .15rem; word-break:break-word; }
.tour-tag .meta{ font-size:.86rem; color:var(--dim); }
.tour-tag .foot{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px dashed var(--line2); }
.status{ font-size:.75rem; font-weight:700; padding:.18rem .55rem; border-radius:999px; }
.status.up{ background:rgba(134,174,220,.16); color:var(--sky); }
.status.on{ background:rgba(108,196,176,.17); color:var(--sea); }
.status.done{ background:rgba(226,238,232,.08); color:var(--dim); }
.status.shared{ background:rgba(242,166,90,.15); color:var(--apricot); }
.new-tag{ border:1.5px dashed var(--line2); border-radius:var(--r-lg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4rem; min-height:170px; color:var(--dim); background:transparent; font-weight:600; }
.new-tag:hover{ color:var(--apricot); border-color:var(--apricot); }
.new-tag i{ font-size:1.6rem; }

/* ---------- tour nav ---------- */
.tour-title{ font-family:var(--display); font-weight:700; font-size:1.08rem; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.tabbar{ border-top:1px solid var(--line); }
.tabbar .nav{ flex-wrap:nowrap; gap:.2rem; padding:.45rem 0; }
.tabbar .nav-link{ color:var(--dim); font-weight:600; font-size:.92rem; border-radius:var(--r-sm); padding:.4rem .75rem; white-space:nowrap; }
.tabbar .nav-link:hover{ color:var(--text); background:var(--panel); }
.tabbar .nav-link.active{ color:var(--apricot-ink); background:var(--apricot); }
.dropdown-menu{ background:var(--panel); border:1px solid var(--line2); border-radius:var(--r); padding:.35rem; }
.dropdown-item{ color:var(--text); border-radius:6px; font-weight:500; padding:.45rem .7rem; }
.dropdown-item:hover,.dropdown-item.active{ background:var(--panel2); color:var(--apricot); }
.offcanvas{ background:var(--bg2); color:var(--text); }
.menu-list button{ display:flex; width:100%; align-items:center; gap:.75rem; background:transparent; border:0; color:var(--text); padding:.75rem .9rem; border-radius:var(--r-sm); font-weight:600; text-align:left; }
.menu-list button.active{ background:var(--apricot); color:var(--apricot-ink); }
.menu-list button i{ width:20px; }

/* ---------- sections ---------- */
main.tour-main{ padding:22px 0 70px; }
.sec-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.sec-head h2{ font-size:1.65rem; font-weight:800; margin:0; }
.sec-head p{ margin:.15rem 0 0; color:var(--dim); font-size:.93rem; }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px; }
.panel + .panel{ margin-top:14px; }
.panel h3{ font-size:1.12rem; font-weight:700; margin:0 0 .7rem; }
.empty{ text-align:center; color:var(--dim); padding:34px 16px; border:1.5px dashed var(--line2); border-radius:var(--r-lg); }
.empty i{ font-size:1.7rem; display:block; margin-bottom:.4rem; color:var(--faint); }

/* overview hero */
.hero{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:26px 22px; position:relative; overflow:hidden; }
.hero::before{ content:""; position:absolute; left:0; right:0; top:0; height:6px; background:var(--tag,var(--apricot)); }
.hero .emoji{ font-size:2.3rem; }
.hero h1{ font-size:clamp(2rem,6vw,3.2rem); font-weight:800; line-height:1.02; margin:.3rem 0 .3rem; word-break:break-word; }
.countdown{ font-family:var(--display); font-weight:800; font-size:1.2rem; color:var(--apricot); }
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-top:14px; }
.stat{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px; }
.stat .v{ font-family:var(--display); font-weight:700; font-size:1.3rem; }
.stat .l{ font-size:.82rem; color:var(--dim); }
.bar{ height:7px; background:var(--bg2); border-radius:9px; overflow:hidden; margin-top:6px; }
.bar > span{ display:block; height:100%; background:var(--sea); border-radius:9px; }
.bar.warn > span{ background:var(--apricot); } .bar.over > span{ background:var(--rose); }

/* day chips */
.day-chips{ position:sticky; top:var(--chips-top,112px); z-index:5; background:var(--bg); padding:.5rem 0; margin-bottom:10px; display:flex; gap:.45rem; overflow-x:auto; scrollbar-width:thin; }
.day-chip{ flex:0 0 auto; background:var(--panel); border:1px solid var(--line); color:var(--dim); border-radius:var(--r); padding:.4rem .75rem; text-align:left; line-height:1.2; }
.day-chip b{ display:block; color:var(--text); font-size:.9rem; }
.day-chip small{ font-size:.74rem; }
.day-chip.active{ background:var(--apricot); border-color:var(--apricot); color:var(--apricot-ink); }
.day-chip.active b{ color:var(--apricot-ink); }
.day-chip.today{ border-color:var(--sea); }
.step{ display:grid; grid-template-columns:130px 1fr auto; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); align-items:start; }
.step:last-child{ border-bottom:0; }
.step .t{ font-weight:700; color:var(--apricot); font-size:.9rem; }
.step .acts{ display:flex; gap:4px; }
@media (max-width:576px){ .step{ grid-template-columns:1fr auto; } .step .t{ grid-column:1 / -1; } }
.tz{ font-size:.7rem; font-weight:700; padding:.1rem .45rem; border-radius:6px; margin-left:.35rem; vertical-align:middle; }
.tz.home{ background:rgba(134,174,220,.18); color:var(--sky); }
.tz.dest{ background:rgba(183,207,110,.17); color:var(--lime); }

/* tables */
.tbl-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); }
table.t{ width:100%; border-collapse:collapse; font-size:.92rem; color:var(--text); }
table.t th{ text-align:left; font-weight:700; color:var(--dim); background:var(--bg2); padding:.6rem .7rem; font-size:.82rem; white-space:nowrap; border-bottom:1px solid var(--line2); }
table.t td{ padding:.6rem .7rem; border-bottom:1px solid var(--line); vertical-align:top; background:var(--panel); }
table.t tr:last-child td{ border-bottom:0; }
table.t td.num,table.t th.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
table.t tfoot td{ background:var(--panel2); font-weight:700; }
.row-acts{ display:flex; gap:4px; justify-content:flex-end; }

/* badges */
.pill{ display:inline-block; font-size:.75rem; font-weight:700; padding:.15rem .5rem; border-radius:999px; background:var(--panel2); color:var(--dim); }
.rv-good{ background:rgba(108,196,176,.18); color:var(--sea); }
.rv-moderate{ background:rgba(134,174,220,.18); color:var(--sky); }
.rv-bad{ background:rgba(242,166,90,.18); color:var(--apricot); }
.rv-verybad{ background:rgba(226,125,140,.2); color:var(--rose); }

/* checklists */
.check-item{ display:flex; align-items:center; gap:.7rem; padding:.55rem 0; border-bottom:1px solid var(--line); }
.check-item:last-child{ border-bottom:0; }
.check-item .txt{ flex:1; min-width:0; word-break:break-word; }
.check-item.done .txt{ color:var(--faint); text-decoration:line-through; }
.check-item .form-check-input{ width:1.25em; height:1.25em; margin:0; flex:0 0 auto; }

/* contacts & notes */
.card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.c-card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; display:flex; flex-direction:column; }
.c-card h4{ font-size:1.1rem; font-weight:700; margin:0; }
.c-card .body{ color:var(--dim); font-size:.92rem; white-space:pre-wrap; word-break:break-word; flex:1; margin-top:.4rem; }
.c-card .body.clamp{ display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.c-card .acts{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
.btn-wa{ background:#1F8F5A; color:#fff; border:0; } .btn-wa:hover{ background:#23A366; color:#fff; }

/* log */
.log-row{ display:flex; gap:12px; padding:.6rem 0; border-bottom:1px solid var(--line); font-size:.92rem; }
.log-row .who{ color:var(--apricot); font-weight:600; }
.log-row time{ color:var(--faint); font-size:.8rem; white-space:nowrap; min-width:118px; }

/* modal */
.modal-content{ background:var(--panel); border:1px solid var(--line2); border-radius:var(--r-lg); color:var(--text); }
.modal-header,.modal-footer{ border-color:var(--line); }
.modal-title{ font-family:var(--display); font-weight:700; }
.time12{ display:flex; gap:6px; }
.time12 select{ flex:1; min-width:0; }
.swatches{ display:flex; gap:8px; flex-wrap:wrap; }
.swatches label{ width:30px; height:30px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
.swatches input{ display:none; }
.swatches input:checked + label{ border-color:var(--text); box-shadow:0 0 0 2px var(--bg) inset; }

.toast-box{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:2000; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
.toast-msg{ background:var(--text); color:var(--bg); font-weight:600; padding:.55rem 1rem; border-radius:999px; font-size:.9rem; box-shadow:0 6px 20px rgba(0,0,0,.35); }
.loading{ min-height:60vh; display:grid; place-items:center; color:var(--dim); }
textarea.day-note{ min-height:90px; }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important; scroll-behavior:auto!important; } }
</style>
</head>
<body>

<div id="bootView" class="loading"><div><div class="spinner-border text-warning mb-2" role="status"></div><div>Loading…</div></div></div>

<!-- ================= AUTH ================= -->
<div id="authView" class="hidden">
  <div class="auth-card">
    <div class="brand"><span class="brand-mark"><i class="bi bi-compass"></i></span>Tour Planner</div>
    <h1 id="authTitle">Sign in</h1>
    <p class="dim mb-4" id="authSub">Your tours sync to every device you sign in on.</p>
    <form id="authForm" novalidate>
      <div class="mb-3 hidden" id="nameWrap">
        <label class="form-label" for="authName">Your name</label>
        <input class="form-control" id="authName" autocomplete="name" placeholder="Shown in the change log">
      </div>
      <div class="mb-3">
        <label class="form-label" for="authEmail">Email</label>
        <input class="form-control" id="authEmail" type="email" autocomplete="email" required>
      </div>
      <div class="mb-3" id="passWrap">
        <label class="form-label" for="authPass">Password</label>
        <input class="form-control" id="authPass" type="password" autocomplete="current-password" minlength="6" required>
      </div>
      <div class="form-check mb-3" id="keepWrap">
        <input class="form-check-input" type="checkbox" id="authKeep">
        <label class="form-check-label dim" for="authKeep">Keep me signed in after closing the browser</label>
      </div>
      <div class="text-danger small mb-2" id="authErr" role="alert"></div>
      <button class="btn btn-accent w-100 py-2" id="authBtn" type="submit">Sign in</button>
    </form>
    <div class="d-flex justify-content-between mt-3 small">
      <a href="#" id="authSwitch">Create an account</a>
      <a href="#" id="authForgot">Forgot password?</a>
    </div>
  </div>
</div>

<!-- ================= HOME (tour list) ================= -->
<div id="homeView" class="hidden">
  <header class="topbar"><div class="container"><div class="topbar-inner">
    <div class="brand me-auto"><span class="brand-mark"><i class="bi bi-compass"></i></span><span>Tour Planner</span></div>
    <span class="user-chip d-none d-sm-inline" id="homeUser"></span>
    <button class="btn btn-ghost btn-sm" data-action="signout"><i class="bi bi-box-arrow-right"></i><span class="d-none d-sm-inline ms-1">Sign out</span></button>
  </div></div></header>
  <div class="container">
    <div class="home-head d-flex justify-content-between align-items-end flex-wrap gap-3">
      <div>
        <h1>Your tours</h1>
        <p class="dim mb-0" id="homeCount">Plan each trip in its own space.</p>
      </div>
      <button class="btn btn-accent" data-action="new-tour"><i class="bi bi-plus-lg me-1"></i>New tour</button>
    </div>
    <div class="tour-grid" id="tourGrid"></div>
  </div>
</div>

<!-- ================= TOUR ================= -->
<div id="tourView" class="hidden">
  <header class="topbar" id="tourTop"><div class="container">
    <div class="topbar-inner">
      <button class="btn-icon" data-action="go-home" title="All tours" aria-label="All tours"><i class="bi bi-arrow-left"></i></button>
      <h2 class="tour-title me-auto" id="tourTitle">Tour</h2>
      <span class="sync-pill" id="syncPill">Connecting</span>
      <button class="btn-icon d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#menuCanvas" aria-label="Open menu"><i class="bi bi-list"></i></button>
    </div>
    <nav class="tabbar d-none d-lg-block" aria-label="Tour sections">
      <ul class="nav" id="deskNav"></ul>
    </nav>
  </div></header>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="menuCanvas" aria-labelledby="menuTitle">
    <div class="offcanvas-header border-bottom" style="border-color:var(--line)!important">
      <h5 class="offcanvas-title display" id="menuTitle">Sections</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body menu-list" id="mobileNav"></div>
  </div>

  <main class="tour-main"><div class="container">
    <section data-tab="overview"></section>
    <section data-tab="plan"></section>
    <section data-tab="activity"></section>
    <section data-tab="expenses"></section>
    <section data-tab="budget"></section>
    <section data-tab="places"></section>
    <section data-tab="food"></section>
    <section data-tab="requests"></section>
    <section data-tab="checklists"></section>
    <section data-tab="contacts"></section>
    <section data-tab="notes"></section>
    <section data-tab="currency"></section>
    <section data-tab="report"></section>
    <section data-tab="log"></section>
    <section data-tab="settings"></section>
  </div></main>
</div>

<!-- generic form modal -->
<div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <form class="modal-content" id="formModalForm" novalidate>
      <div class="modal-header"><h5 class="modal-title" id="formModalTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="formModalBody"></div>
      <div class="modal-footer">
        <span class="text-danger small me-auto" id="formModalErr"></span>
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-accent" id="formModalOk">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- info / confirm modal -->
<div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="infoTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="infoBody"></div>
      <div class="modal-footer" id="infoFoot"></div>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<input type="time" id="nativeTime" class="hidden" aria-hidden="true" tabindex="-1">
<div class="toast-box" id="toastBox" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

/* ============================ helpers ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const CLIENT = nid();
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };
const round = (n, d = 4) => Math.round(n * 10 ** d) / 10 ** d;
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const byId = (arr, id) => arr.find(x => x.id === id);
const tsMs = t => t?.toMillis ? t.toMillis() : (typeof t === 'number' ? t : 0);
function isoLocal(d = new Date()) { const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; }
function parseISO(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDaysISO(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return isoLocal(d); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function fmtDate(s, o) { const d = parseISO(s); return d ? d.toLocaleDateString('en-GB', o || { weekday: 'short', day: 'numeric', month: 'short' }) : ''; }
const fmtDateLong = s => fmtDate(s, { day: 'numeric', month: 'short', year: 'numeric' });
function to12(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`; }
const fmtN = (n, d = 2) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: d });

/* ============================ rates & money ============================ */
async function fetchRates(force) {
  if (!force && RATES && Date.now() - RATES.fetched < 6 * 3600e3) return RATES;
  const r = await fetch('https://open.er-api.com/v6/latest/USD');
  const j = await r.json();
  if (j.result !== 'success') throw new Error('Rate service unavailable');
  RATES = { rates: j.rates, time: j.time_last_update_utc, fetched: Date.now() };
  localStorage.setItem('tp:rates', JSON.stringify(RATES));
  return RATES;
}
function crossRate(from, to) {
  if (!from || !to) return null;
  if (from === to) return 1;
  if (T?.rate) { if (from === T.destCur && to === T.homeCur) return num(T.rate); if (from === T.homeCur && to === T.destCur) return 1 / num(T.rate); }
  const r = RATES?.rates; if (!r || !r[from] || !r[to]) return null;
  return r[to] / r[from];
}
function liveRate(from, to) { const r = RATES?.rates; if (!r || !r[from] || !r[to]) return null; return r[to] / r[from]; }
function toHome(a, cur) { a = num(a); if (!cur || cur === T.homeCur) return a; const x = crossRate(cur, T.homeCur); return x == null ? a : a * x; }
function homeToDest(a) { const x = crossRate(T.homeCur, T.destCur); return x == null ? null : a * x; }
const curOptions = () => [...new Set([T.destCur, T.homeCur, 'USD'].filter(Boolean))];
const dualMoney = h => { const d = homeToDest(h); return `${money(h, T.homeCur)}${d != null && T.destCur !== T.homeCur ? `<div class="faint small">${money(d, T.destCur)}</div>` : ''}`; };

/* ============================ state model ============================ */
function buildDays(s, e) {
  if (!s) return [{ id: nid(), date: '', title: '', steps: [], note: '' }];
  const n = e && e >= s ? Math.min(daysBetween(s, e) + 1, 120) : 1;
  return range(0, n - 1).map(i => ({ id: nid(), date: addDaysISO(s, i), title: '', steps: [], note: '' }));
}
function defaultLists() {
  const mk = (name, items, priced = false) => ({ id: nid(), name, priced, items: items.map(t => ({ id: nid(), text: t, done: false, price: '', cur: '' })) });
  return [
    mk('Pre-trip shopping', [], true),
    mk('Packing', ['Passport / national ID', 'Tickets and booking printouts', 'Phone charger and power bank', 'Personal medicines', 'Cash and cards', 'Toiletries', 'Weather-right clothes']),
    mk('Documents', ['Passport and visa copies', 'Hotel booking confirmations', 'Travel insurance', 'Emergency contact list']),
    mk('Important to-dos', [])
  ];
}
function freshState(meta) {
  return { days: buildDays(meta?.startDate, meta?.endDate), activity: {}, places: [], food: [], budget: [], expenses: [], requests: [], lists: defaultLists(), contacts: [], notes: [], log: [] };
}
function normalize(s) {
  const f = freshState(T); if (!s) return f;
  const o = { ...f, ...s };
  ['days', 'places', 'food', 'budget', 'expenses', 'requests', 'lists', 'contacts', 'notes', 'log'].forEach(k => { if (!Array.isArray(o[k])) o[k] = f[k]; });
  if (!o.activity || typeof o.activity !== 'object') o.activity = {};
  o.days.forEach(d => { d.steps = d.steps || []; });
  o.lists.forEach(l => { l.items = l.items || []; });
  Object.values(o.activity).forEach(a => { a.entries = a.entries || []; });
  return o;
}
// keep the plan, drop what happened on the trip
function templateFrom(src, meta) {
  const clone = x => JSON.parse(JSON.stringify(x));
  const cp = s => ({ ...s, id: nid() });
  let days;
  if (meta.startDate) {
    days = buildDays(meta.startDate, meta.endDate);
    days.forEach((d, i) => { const o = src.days[i]; if (o) { d.title = o.title || ''; d.note = o.note || ''; d.steps = (o.steps || []).map(cp); } });
    src.days.slice(days.length).forEach(o => days.push({ id: nid(), date: '', title: o.title || '', note: o.note || '', steps: (o.steps || []).map(cp) }));
  } else days = src.days.map(o => ({ id: nid(), date: '', title: o.title || '', note: o.note || '', steps: (o.steps || []).map(cp) }));
  return {
    days, activity: {}, places: src.places.map(p => ({ ...p, id: nid(), status: 'planned', date: '', rating: '' })), food: [], expenses: [],
    budget: clone(src.budget).map(cp), requests: [],
    lists: clone(src.lists).map(l => ({ ...l, id: nid(), items: l.items.map(i => ({ ...i, id: nid(), done: false })) })),
    contacts: clone(src.contacts).map(cp), notes: clone(src.notes).map(cp), log: []
  };
}

/* ============================ sync ============================ */
function setSync(cls, text) { const p = $('#syncPill'); p.className = 'sync-pill ' + cls; p.textContent = text; }
function addLog(what) { S.log.unshift({ t: Date.now(), who: myName(), what }); if (S.log.length > 300) S.log.length = 300; }
function schedulePush() { clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 900); setSync('busy', 'Saving…'); }
function commit(what, opts = {}) { if (what) addLog(what); schedulePush(); if (opts.render !== false) renderActive(); }
async function pushNow() {
  clearTimeout(pushTimer); pushTimer = null;
  if (!S || !stateRef) return;
  const ref = stateRef, tRef = tourRef;
  pendingLocal = true;
  setSync(navigator.onLine ? 'busy' : 'off', navigator.onLine ? 'Saving…' : 'Offline, saved on device');
  try {
    await setDoc(ref, { state: JSON.parse(JSON.stringify(S)), updatedAt: serverTimestamp(), updatedBy: myName(), clientId: CLIENT });
    pendingLocal = false;
    if (ref === stateRef) setSync('ok', 'Synced');
    updateDoc(tRef, { updatedAt: serverTimestamp() }).catch(() => { });
  } catch (e) {
    pendingLocal = false; console.error(e);
    setSync('err', 'Sync failed'); toast('Could not save to the cloud (' + (e.code || e.message) + ')');
  }
}
function onState(snap) {
  const md = snap.metadata;
  if (!snap.exists()) {
    if (md.fromCache) return;            // wait for the server before deciding it's new
    if (!S) { S = normalize(null); addLog('Set up tour data'); pushNow(); renderActive(); }
    return;
  }
  const d = snap.data();
  if (!S) { S = normalize(d.state); renderActive(); }
  else if (!md.hasPendingWrites && d.clientId !== CLIENT && !pendingLocal && !pushTimer) {
    S = normalize(d.state); renderActive(true);
    if (d.updatedBy && d.updatedBy !== myName()) toast(`Updated by ${d.updatedBy}`);
  }
  if (!pushTimer && !pendingLocal) {
    if (!navigator.onLine) setSync('off', 'Offline');
    else if (md.hasPendingWrites) setSync('busy', 'Saving…');
    else if (md.fromCache) setSync('off', 'Offline copy');
    else setSync('ok', 'Synced');
  }
}
const flush = () => { if (pushTimer) pushNow(); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
window.addEventListener('pagehide', flush);
window.addEventListener('online', () => { if (T && !pushTimer) setSync('ok', 'Synced'); });
window.addEventListener('offline', () => { if (T) setSync('off', 'Offline'); });

/* ============================ views & routing ============================ */
function showView(v) { ['bootView', 'authView', 'homeView', 'tourView'].forEach(id => $('#' + id).classList.toggle('hidden', id !== v)); }
function parseHash() { const p = location.hash.replace(/^#\/?/, '').split('/'); return p[0] === 'tour' && p[1] ? { view: 'tour', id: p[1], tab: p[2] || '' } : { view: 'home' }; }
function route() {
  if (!CU) return;
  const r = parseHash();
  if (r.view === 'tour') openTour(r.id, r.tab);
  else { closeTour(); showView('homeView'); document.title = 'Tour Planner'; renderHome(); }
}
window.addEventListener('hashchange', route);

function subscribeTours() {
  if (unsubTours) unsubTours();
  const q = query(collection(db, 'tours'), where('memberEmails', 'array-contains', myEmail()));
  unsubTours = onSnapshot(q, snap => {
    TOURS = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    TOURS.sort((a, b) => tsMs(b.updatedAt) - tsMs(a.updatedAt));
    toursLoaded = true;
    if (parseHash().view === 'home') renderHome();
  }, err => {
    console.error(err);
    $('#tourGrid').innerHTML = `<div class="empty"><i class="bi bi-exclamation-triangle"></i>Could not load your tours (${esc(err.code || err.message)}). Check that the Firestore rules from the setup guide are published.</div>`;
  });
}

function openTour(id, tab) {
  if (T?.id !== id) {
    closeTour();
    T = { id }; S = null;
    $('#tourTitle').textContent = 'Loading…';
    $$('main.tour-main section').forEach(s => { s.innerHTML = ''; });
    setSync('busy', 'Connecting');
    tourRef = doc(db, 'tours', id);
    stateRef = doc(db, 'tours', id, 'data', 'state');
    unsubTour = onSnapshot(tourRef, snap => {
      if (!snap.exists()) { if (!snap.metadata.fromCache) { toast('This tour was deleted or you no longer have access.'); location.hash = '#/'; } return; }
      T = { id, ...snap.data({ serverTimestamps: 'estimate' }) };
      applyTourMeta(); renderActive(true);
    }, err => { console.error(err); toast('You do not have access to that tour.'); location.hash = '#/'; });
    unsubState = onSnapshot(stateRef, { includeMetadataChanges: true }, onState, err => { console.error(err); setSync('err', 'Sync failed'); });
  }
  showView('tourView');
  const valid = TABS.some(t => t[0] === tab);
  showTab(valid ? tab : (localStorage.getItem('tp:tab:' + id) || 'overview'), !valid);
  requestAnimationFrame(setChipsTop);
}
function closeTour() {
  flush();
  if (unsubTour) unsubTour(); if (unsubState) unsubState();
  unsubTour = unsubState = null; T = null; S = null; tourRef = stateRef = null;
  expFilter = placeFilter = foodFilter = logQ = 'all'; noteQ = ''; CV.from = CV.to = null;
}
function applyTourMeta() {
  $('#tourTitle').textContent = `${T.emoji || ''} ${T.name || ''}`.trim();
  document.title = `${T.name} | Tour Planner`;
  document.documentElement.style.setProperty('--tag', T.color || SWATCHES[0]);
}
function setChipsTop() { const h = $('#tourTop')?.offsetHeight; if (h) document.documentElement.style.setProperty('--chips-top', h + 'px'); }
window.addEventListener('resize', setChipsTop);

function buildNav() {
  const prim = TABS.slice(0, 5), more = TABS.slice(5);
  $('#deskNav').innerHTML = prim.map(([k, l, i]) => `<li class="nav-item"><a href="#" class="nav-link" data-action="tab" data-tab-link="${k}"><i class="bi ${i} me-1"></i>${l}</a></li>`).join('')
    + `<li class="nav-item dropdown"><a href="#" class="nav-link dropdown-toggle" id="moreToggle" data-action="noop" data-bs-toggle="dropdown" role="button" aria-expanded="false">More</a><ul class="dropdown-menu">${more.map(([k, l, i]) => `<li><a href="#" class="dropdown-item" data-action="tab" data-tab-link="${k}"><i class="bi ${i} me-2"></i>${l}</a></li>`).join('')}</ul></li>`;
  $('#mobileNav').innerHTML = TABS.map(([k, l, i]) => `<button data-action="tab" data-tab-link="${k}"><i class="bi ${i}"></i>${l}</button>`).join('');
}
let tabLock = false;
function showTab(k, scroll = true) {
  if (!T) return;
  curTab = k; localStorage.setItem('tp:tab:' + T.id, k);
  $$('main.tour-main section').forEach(s => s.classList.toggle('hidden', s.dataset.tab !== k));
  $$('[data-tab-link]').forEach(a => a.classList.toggle('active', a.dataset.tabLink === k));
  $('#moreToggle')?.classList.toggle('active', TABS.slice(5).some(t => t[0] === k));
  history.replaceState(null, '', `#/tour/${T.id}/${k}`);
  renderActive();
  if (scroll) window.scrollTo({ top: 0 });
  // debounce guard so a double tap can't flicker the mobile menu
  if (!tabLock) { tabLock = true; bootstrap.Offcanvas.getInstance($('#menuCanvas'))?.hide(); setTimeout(() => { tabLock = false; }, 350); }
}
function renderActive(keepScroll) {
  if (!T || !S || !T.name) { const s = $(`section[data-tab="${curTab}"]`); if (s && !s.innerHTML) s.innerHTML = '<div class="loading"><div class="spinner-border text-warning" role="status"></div></div>'; return; }
  const sec = $(`section[data-tab="${curTab}"]`);
  if (!sec || !RENDER[curTab]) return;
  // don't wipe a note someone is typing in
  if (keepScroll && document.activeElement && sec.contains(document.activeElement) && document.activeElement.matches('textarea,input')) return;
  RENDER[curTab](sec);
}

/* ============================ UI helpers ============================ */
const head = (title, sub, btns = '') => `<div class="sec-head"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><div class="d-flex gap-2 flex-wrap">${btns}</div></div>`;
const emptyBox = (icon, text, btn = '') => `<div class="empty"><i class="bi ${icon}"></i>${text}${btn ? `<div class="mt-3">${btn}</div>` : ''}</div>`;
const iconBtn = (action, id, icon, title, extra = '', data = '') => `<button class="btn-icon ${extra}" data-action="${action}" data-id="${id}" ${data} title="${title}" aria-label="${title}"><i class="bi ${icon}"></i></button>`;
const addBtn = (action, label, cls = 'btn-accent') => `<button class="btn ${cls} btn-sm" data-action="${action}"><i class="bi bi-plus-lg me-1"></i>${label}</button>`;
const selectOpts = (opts, v) => opts.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v ?? '') ? 'selected' : ''}>${esc(lab)}</option>`; }).join('');
const bar = (pct, extra = '') => `<div class="bar ${pct > 100 ? 'over' : pct > 85 ? 'warn' : ''} ${extra}"><span style="width:${Math.min(100, Math.max(0, pct))}%"></span></div>`;
const rvClass = r => 'rv-' + String(r || '').toLowerCase().replace(/\s+/g, '');

const formModal = new bootstrap.Modal('#formModal');
const infoModal = new bootstrap.Modal('#infoModal');
let formHandler = null;

function fieldHTML(f, v) {
  const id = 'f_' + f.name, col = f.col || 'col-12';
  v = v ?? f.value ?? '';
  const lab = `<label class="form-label" for="${id}">${esc(f.label)}</label>`;
  const help = f.help ? `<div class="faint small mt-1">${esc(f.help)}</div>` : '';
  switch (f.type) {
    case 'textarea': return `<div class="${col}">${lab}<textarea class="form-control" id="${id}" name="${f.name}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>${help}</div>`;
    case 'select': return `<div class="${col}">${lab}<select class="form-select" id="${id}" name="${f.name}">${selectOpts(f.options, v)}</select>${help}</div>`;
    case 'check': return `<div class="${col}"><div class="form-check"><input class="form-check-input" type="checkbox" id="${id}" name="${f.name}" ${v ? 'checked' : ''}><label class="form-check-label" for="${id}">${esc(f.label)}</label></div>${help}</div>`;
    case 'swatch': return `<div class="${col}"><span class="form-label d-block">${esc(f.label)}</span><div class="swatches">${SWATCHES.map((c, i) => `<input type="radio" name="${f.name}" id="${id}${i}" value="${c}" ${(v || SWATCHES[0]) === c ? 'checked' : ''}><label for="${id}${i}" style="background:${c}" title="${c}"></label>`).join('')}</div></div>`;
    case 'time12': {
      let h = '', m = '00', ap = 'AM';
      if (v) { const [H, M] = v.split(':').map(Number); ap = H >= 12 ? 'PM' : 'AM'; h = String(H % 12 || 12); m = String(M).padStart(2, '0'); }
      return `<div class="${col}">${lab}<div class="time12">
        <select class="form-select" id="${id}" name="${f.name}_h" aria-label="Hour"><option value="">Hour</option>${range(1, 12).map(x => `<option ${String(x) === h ? 'selected' : ''}>${x}</option>`).join('')}</select>
        <select class="form-select" name="${f.name}_m" aria-label="Minute">${range(0, 59).map(x => { const s = String(x).padStart(2, '0'); return `<option ${s === m ? 'selected' : ''}>${s}</option>`; }).join('')}</select>
        <select class="form-select" name="${f.name}_ap" aria-label="AM or PM"><option ${ap === 'AM' ? 'selected' : ''}>AM</option><option ${ap === 'PM' ? 'selected' : ''}>PM</option></select>
        <span class="btn-icon position-relative flex-shrink-0" style="width:38px;height:38px" title="Pick on clock"><i class="bi bi-clock"></i><input type="time" data-clock="${f.name}" value="${esc(v)}" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer" aria-label="Pick ${esc(f.label)} on a clock"></span>
      </div>${help}</div>`;
    }
    default: {
      const t = f.type || 'text';
      const extra = t === 'number' ? 'step="any" inputmode="decimal"' : '';
      return `<div class="${col}">${lab}<input class="form-control" id="${id}" name="${f.name}" type="${t}" ${extra} value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${t === 'email' ? 'autocomplete="email"' : ''}>${help}</div>`;
    }
  }
}
function readField(f) {
  const b = $('#formModalBody');
  if (f.type === 'time12') {
    const h = b.querySelector(`[name="${f.name}_h"]`).value; if (!h) return '';
    let H = Number(h) % 12; if (b.querySelector(`[name="${f.name}_ap"]`).value === 'PM') H += 12;
    return `${String(H).padStart(2, '0')}:${b.querySelector(`[name="${f.name}_m"]`).value}`;
  }
  if (f.type === 'check') return b.querySelector(`[name="${f.name}"]`).checked;
  if (f.type === 'swatch') return b.querySelector(`[name="${f.name}"]:checked`)?.value || '';
  const v = b.querySelector(`[name="${f.name}"]`).value.trim();
  return f.type === 'number' ? (v === '' ? '' : num(v)) : v;
}

/* ============================ computed totals ============================ */
function spendParts() {
  const exp = S.expenses.reduce((a, e) => a + toHome(e.amount, e.cur), 0);
  const food = S.food.reduce((a, f) => a + (f.price ? toHome(f.price, f.cur) : 0), 0);
  const req = S.requests.filter(r => r.bought).reduce((a, r) => a + toHome(r.price, r.cur), 0);
  const pre = S.lists.filter(l => l.priced).flatMap(l => l.items).reduce((a, i) => a + (i.price ? toHome(i.price, i.cur) : 0), 0);
  return { exp, food, req, pre, total: exp + food + req };
}
function budgetRange() { let min = 0, max = 0; S.budget.forEach(b => { min += toHome(b.min, b.cur); max += toHome(b.max || b.min, b.cur); }); return { min, max }; }
function checklistProgress() { const it = S.lists.flatMap(l => l.items); return { done: it.filter(i => i.done).length, total: it.length }; }
function tourStatus(t) {
  const today = isoLocal();
  if (!t.startDate) return { cls: 'up', label: 'No dates yet' };
  if (today < t.startDate) { const n = daysBetween(today, t.startDate); return { cls: 'up', label: n === 1 ? 'Starts tomorrow' : `Starts in ${n} days` }; }
  if (!t.endDate || today <= t.endDate) { const d = daysBetween(t.startDate, today) + 1, tot = t.endDate ? daysBetween(t.startDate, t.endDate) + 1 : null; return { cls: 'on', label: tot ? `Day ${d} of ${tot}` : `Day ${d}` }; }
  return { cls: 'done', label: 'Completed' };
}
function curDayId() {
  let id = localStorage.getItem('tp:day:' + T.id);
  if (!S.days.some(d => d.id === id)) id = (S.days.find(d => d.date === isoLocal()) || S.days[0])?.id;
  return id;
}
const dayLabel = d => { const i = S.days.indexOf(d); return `Day ${i + 1}${d.date ? ` (${fmtDate(d.date)})` : ''}`; };
function chips(activeId) {
  const today = isoLocal();
  return `<div class="day-chips" role="tablist" aria-label="Days">${S.days.map((d, i) => `<button class="day-chip ${d.id === activeId ? 'active' : ''} ${d.date === today ? 'today' : ''}" data-action="pick-day" data-id="${d.id}" role="tab" aria-selected="${d.id === activeId}"><b>Day ${i + 1}</b><small>${d.date ? fmtDate(d.date) : 'No date'}</small></button>`).join('')}</div>`;
}

function tourFields(withTemplate, skipId) {
  const f = [
    { name: 'name', label: 'Tour name', required: true, ph: 'e.g. Dhaka tour' },

    { name: 'startDate', label: 'Start date', type: 'date', col: 'col-6' },
    { name: 'endDate', label: 'End date', type: 'date', col: 'col-6' },
    { name: 'homeCur', label: 'Home currency', col: 'col-6', ph: 'BDT' },
    { name: 'destCur', label: 'Destination currency', col: 'col-6', ph: 'INR' },
    { name: 'homeTz', label: 'Home time label', col: 'col-6', ph: 'BDT' },
    { name: 'destTz', label: 'Destination time label', col: 'col-6', ph: 'IST' },
    { name: 'rate', label: 'Rate: 1 unit of destination currency in home currency', type: 'number', help: 'Leave empty to use the live rate. Totals are converted to your home currency with this.' },
    { name: 'emoji', label: 'Icon', col: 'col-4', ph: '🏔️' },
    { name: 'color', label: 'Colour', type: 'swatch', col: 'col-8' }
  ];
  if (withTemplate && TOURS.length) f.push({ name: 'template', label: 'Start from', type: 'select', options: [['', 'A blank tour'], ...TOURS.map(t => [t.id, `The plan of "${t.name}"`])], help: 'Copying a plan brings the day plan, budget, checklists, contacts and notes, but not spending or logs.' });
  return f;
}
function cleanMeta(v) {
  const cur = x => String(x || '').toUpperCase().trim();
  if (v.startDate && v.endDate && v.endDate < v.startDate) return 'End date is before the start date.';
  const homeCur = cur(v.homeCur) || 'BDT', destCur = cur(v.destCur) || homeCur;
  if (!/^[A-Z]{3}$/.test(homeCur) || !/^[A-Z]{3}$/.test(destCur)) return 'Currencies must be 3-letter codes like BDT, INR or USD.';
  return { name: v.name, destination: v.destination || '', startDate: v.startDate || '', endDate: v.endDate || '', homeCur, destCur, homeTz: v.homeTz || homeCur, destTz: v.destTz || destCur, rate: num(v.rate) || 0, emoji: v.emoji || '🧭', color: v.color || SWATCHES[0] };
}
async function fillRate(meta) {
  if (meta.homeCur === meta.destCur) { meta.rate = 1; return; }
  if (!meta.rate) { try { await fetchRates(); meta.rate = round(liveRate(meta.destCur, meta.homeCur) || 0); } catch { } }
}
function newTourForm(prefill = {}) {
  openForm({
    title: prefill.template ? 'Duplicate tour' : 'New tour', ok: 'Create tour', fields: tourFields(true),
    values: { homeCur: 'BDT', homeTz: 'BDT', color: SWATCHES[TOURS.length % SWATCHES.length], ...prefill },
    onSubmit: async v => {
      const m = cleanMeta(v); if (typeof m === 'string') return m;
      await fillRate(m);
      const ref = doc(collection(db, 'tours'));
      const meta = { ...m, ownerUid: CU.uid, ownerEmail: myEmail(), ownerName: myName(), memberEmails: [myEmail()], createdAt: serverTimestamp(), updatedAt: serverTimestamp() };
      let st = freshState(meta);
      if (v.template) { try { const s = await getDoc(doc(db, 'tours', v.template, 'data', 'state')); if (s.exists()) { const prevT = T; T = { ...meta }; st = templateFrom(normalize(s.data().state), meta); T = prevT; } } catch (e) { console.error(e); } }
      st.log = [{ t: Date.now(), who: myName(), what: v.template ? 'Created the tour from an existing plan' : 'Created the tour' }];
      // written in order: the tour first, then its data (the rules check the tour doc)
      setDoc(ref, meta).catch(e => toast('Could not create tour (' + (e.code || e.message) + ')'));
      setDoc(doc(db, 'tours', ref.id, 'data', 'state'), { state: st, updatedAt: serverTimestamp(), updatedBy: myName(), clientId: CLIENT }).catch(e => console.error(e));
      toast(`Created ${meta.name}`);
      location.hash = `#/tour/${ref.id}/overview`;
    }
  });
}

/* ============================ PDF ============================ */
function pdfSafe(s) {
  return String(s ?? '').replace(/[–—]/g, '-').replace(/[→⇒]/g, '->').replace(/←/g, '<-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/…/g, '...').replace(/₹/g, 'Rs.').replace(/৳/g, 'Tk').replace(/[•·]/g, '-').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, '').trim();
}
function genPDF() {
  const pick = new Set($$('[data-report]').filter(c => c.checked).map(c => c.dataset.report));
  if (!pick.size) { toast('Pick at least one section'); return; }
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
  const H = pdf.internal.pageSize.getHeight(); let y = 52;
  const H$ = T.homeCur;
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(20); pdf.text(pdfSafe(T.name) || 'Tour', 40, y);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10); y += 16;
  pdf.text(pdfSafe(`${T.destination || ''}  ${T.startDate ? fmtDateLong(T.startDate) : ''}${T.endDate ? ' to ' + fmtDateLong(T.endDate) : ''}  |  Generated ${new Date().toLocaleString()}`), 40, y);
  const cell = c => (c && typeof c === 'object') ? { ...c, content: pdfSafe(c.content) } : pdfSafe(c);
  const table = (title, headRow, body, foot) => {
    if (y > H - 110) { pdf.addPage(); y = 40; }
    y += 26; pdf.setFont('helvetica', 'bold'); pdf.setFontSize(13); pdf.text(pdfSafe(title), 40, y); y += 6;
    pdf.autoTable({
      startY: y, head: [headRow.map(pdfSafe)], body: body.length ? body.map(r => r.map(cell)) : [[{ content: 'Nothing recorded', colSpan: headRow.length }]],
      foot: foot ? [foot.map(cell)] : undefined, showFoot: 'lastPage', theme: 'grid',
      styles: { fontSize: 9, cellPadding: 4, overflow: 'linebreak', lineColor: [210, 220, 216] },
      headStyles: { fillColor: [22, 48, 47], textColor: 255 }, footStyles: { fillColor: [242, 166, 90], textColor: [59, 34, 8], fontStyle: 'bold' },
      margin: { left: 40, right: 40 }
    });
    y = pdf.lastAutoTable.finalY;
  };
  const dayRow = (d, extra) => [{ content: `${dayLabel(d)}${extra ? ': ' + extra : ''}`, colSpan: 2, styles: { fontStyle: 'bold', fillColor: [232, 242, 238] } }];
  const sp = spendParts(), br = budgetRange(), cp = checklistProgress();
  if (pick.has('summary')) table('Summary', ['Item', 'Value'], [
    ['Destination', T.destination || '-'], ['Travellers', T.memberEmails.join(', ')],
    ['Total spent', money(sp.total, H$)], ['  Expenses', money(sp.exp, H$)], ['  Food', money(sp.food, H$)], ['  Requests bought', money(sp.req, H$)],
    ['Planned budget', br.max ? `${money(br.min, H$)} to ${money(br.max, H$)}` : '-'], ['Pre-trip shopping (not in totals)', money(sp.pre, H$)],
    ['Rate used', `1 ${T.destCur} = ${T.rate} ${H$}`], ['Checklists', `${cp.done} of ${cp.total} done`]]);
  if (pick.has('plan')) { const b = []; S.days.forEach(d => { b.push(dayRow(d, d.title)); d.steps.forEach(s => b.push([s.time || '', s.text])); if (d.note) b.push(['Note', d.note]); }); table('Day plan', ['Time', 'Plan'], b); }
  if (pick.has('activity')) { const b = []; S.days.forEach(d => { const a = S.activity[d.id]; if (!a || (!a.entries.length && !a.title)) return; b.push(dayRow(d, a.title)); [...a.entries].sort((x, y2) => (x.start || '').localeCompare(y2.start || '')).forEach(e => b.push([`${to12(e.start)}${e.end ? ' - ' + to12(e.end) : ''} ${e.tz === 'home' ? T.homeTz : T.destTz}`, e.text + (e.place ? ` (${e.place})` : '')])); }); table('My activity', ['Time', 'What happened'], b); }
  if (pick.has('expenses')) {
    const list = [...S.expenses].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    table('Expenses', ['Date', 'Item', 'Category', 'Paid by', 'Amount', `In ${H$}`], list.map(e => [e.date ? fmtDate(e.date) : '', e.item, e.category, e.paidBy || '', money(e.amount, e.cur), fmtN(toHome(e.amount, e.cur))]), ['', '', '', '', 'Subtotal', fmtN(sp.exp)]);
    const byCat = {}; S.expenses.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + toHome(e.amount, e.cur); });
    if (Object.keys(byCat).length) table('Expenses by category', ['Category', `Total in ${H$}`], Object.entries(byCat).map(([k, v]) => [k, fmtN(v)]), ['Subtotal', fmtN(sp.exp)]);
  }
  if (pick.has('budget')) table('Budget', ['Item', 'Category', 'From', 'To', `In ${H$}`], S.budget.map(b => [b.item, b.category, money(b.min, b.cur), b.max ? money(b.max, b.cur) : '', `${fmtN(toHome(b.min, b.cur), 0)}${b.max ? ' - ' + fmtN(toHome(b.max, b.cur), 0) : ''}`]), ['', '', '', 'Subtotal', `${fmtN(br.min, 0)} - ${fmtN(br.max, 0)}`]);
  if (pick.has('places')) table('Places', ['Place', 'Status', 'Date', 'Rating', 'Notes'], S.places.map(p => [p.name + (p.area ? ', ' + p.area : ''), p.status === 'visited' ? 'Visited' : 'To visit', p.date ? fmtDate(p.date) : '', p.rating || '', p.notes || '']));
  if (pick.has('food')) table('Food', ['Date', 'Dish', 'Where', 'Review', 'Price'], [...S.food].sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(f => [f.date ? fmtDate(f.date) : '', f.dish, f.where || '', f.review || '', f.price ? money(f.price, f.cur) : '']), ['', '', '', 'Subtotal', money(sp.food, H$)]);
  if (pick.has('requests')) table('Requests', ['Item', 'Qty', 'For', 'Status', 'Price'], S.requests.map(r => [r.item, r.qty || '', r.forWhom || '', r.bought ? 'Bought' : 'Pending', num(r.price) ? money(r.price, r.cur) : '']), ['', '', '', 'Bought subtotal', money(sp.req, H$)]);
  if (pick.has('checklists')) S.lists.forEach(l => { const tot = l.items.reduce((a, i) => a + (i.price ? toHome(i.price, i.cur) : 0), 0); table(`Checklist: ${l.name}`, l.priced ? ['Item', 'Done', 'Price'] : ['Item', 'Done'], l.items.map(i => l.priced ? [i.text, i.done ? 'Yes' : '', i.price ? money(i.price, i.cur) : ''] : [i.text, i.done ? 'Yes' : '']), l.priced ? ['', 'Subtotal (not in trip totals)', money(tot, H$)] : null); });
  if (pick.has('contacts')) table('Important notes', ['Name', 'Role', 'Phone', 'Details'], S.contacts.map(c => [c.name, c.role || '', c.phone || '', c.details || '']));
  if (pick.has('notes')) table('Notes', ['Title', 'Note'], S.notes.map(n => [n.title, n.body]));
  const pages = pdf.internal.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(120); pdf.text(`${pdfSafe(T.name)}  |  page ${i} of ${pages}`, 40, H - 20); }
  pdf.save(`${slug(T.name)}-report.pdf`);
  addLog('Downloaded a PDF report'); schedulePush();
}

/* ============================ ACTIONS ============================ */
const dayOf = id => S.days.find(d => d.id === id);
const findStep = sid => { for (const d of S.days) { const s = d.steps.find(x => x.id === sid); if (s) return { d, s }; } return {}; };
const findAct = eid => { for (const [dayId, a] of Object.entries(S.activity)) { const e = a.entries.find(x => x.id === eid); if (e) return { dayId, a, e }; } return {}; };
const curSel = (v) => ({ name: 'cur', label: 'Currency', type: 'select', options: curOptions(), col: 'col-5', value: v });
async function delFrom(arr, id, label, what) { const it = byId(arr, id); if (!it) return; if (!await confirmBox('Delete?', `Delete <b>${esc(label(it))}</b>? This can't be undone.`)) return; arr.splice(arr.indexOf(it), 1); commit(what(it)); }

function expenseForm(e) {
  openForm({
    title: e ? 'Edit expense' : 'Add expense', values: e || { date: isoLocal(), cur: T.destCur, category: 'Food', paidBy: myName() }, fields: [
      { name: 'item', label: 'What did you pay for?', required: true, ph: 'e.g. Shared jeep to Gangtok' },
      { name: 'amount', label: 'Amount', type: 'number', required: true, col: 'col-7' }, curSel(),
      { name: 'category', label: 'Category', type: 'select', options: CATS, col: 'col-6' }, { name: 'date', label: 'Date', type: 'date', col: 'col-6' },
      { name: 'paidBy', label: 'Paid by' }, { name: 'note', label: 'Note', type: 'textarea', rows: 2 }],
    onSubmit: v => { if (e) { Object.assign(e, v); commit(`Edited expense "${v.item}"`); } else { S.expenses.push({ id: nid(), created: Date.now(), ...v }); commit(`Added expense "${v.item}" (${money(v.amount, v.cur)})`); } }
  });
}
function activityForm(e, dayId) {
  openForm({
    title: e ? 'Edit activity' : `Log activity, ${dayLabel(dayOf(dayId))}`, values: e || { tz: 'dest' }, fields: [
      { name: 'start', label: 'Start time', type: 'time12' }, { name: 'end', label: 'End time', type: 'time12' },
      { name: 'tz', label: 'Time shown in', type: 'select', options: [['dest', T.destTz], ['home', T.homeTz]], col: 'col-6' }, { name: 'place', label: 'Where', col: 'col-6' },
      { name: 'text', label: 'What did you do?', type: 'textarea', required: true }],
    onSubmit: v => {
      if (v.start && v.end && v.end < v.start && !confirm('End time is before start time. Save anyway?')) return 'Check the times.';
      if (e) { Object.assign(e, v); commit(`Edited an activity on ${dayLabel(dayOf(dayId))}`); }
      else { S.activity[dayId] = S.activity[dayId] || { title: '', entries: [] }; S.activity[dayId].entries.push({ id: nid(), by: myName(), ...v }); commit(`Logged activity on ${dayLabel(dayOf(dayId))}`); }
    }
  });
}
function placeForm(p) {
  openForm({
    title: p ? 'Edit place' : 'Add place', values: p || { status: 'planned' }, fields: [
      { name: 'name', label: 'Place', required: true }, { name: 'area', label: 'Area or city' },
      { name: 'status', label: 'Status', type: 'select', options: [['planned', 'To visit'], ['visited', 'Visited']], col: 'col-6' }, { name: 'date', label: 'Date visited', type: 'date', col: 'col-6' },
      { name: 'rating', label: 'How was it?', type: 'select', options: [['', 'No rating'], ...RATINGS] }, { name: 'link', label: 'Map or website link', type: 'url', ph: 'Leave empty to search Google Maps' },
      { name: 'notes', label: 'Notes', type: 'textarea', rows: 2 }],
    onSubmit: v => { if (v.status === 'visited' && !v.date) v.date = isoLocal(); if (p) { Object.assign(p, v); commit(`Edited place "${v.name}"`); } else { S.places.push({ id: nid(), ...v }); commit(`Added place "${v.name}"`); } }
  });
}
function foodForm(f) {
  openForm({
    title: f ? 'Edit food' : 'Log food', values: f || { date: isoLocal(), cur: T.destCur, review: 'Good' }, fields: [
      { name: 'dish', label: 'Dish', required: true }, { name: 'where', label: 'Where you ate' },
      { name: 'price', label: 'Price', type: 'number', col: 'col-7' }, curSel(),
      { name: 'review', label: 'Review', type: 'select', options: REVIEWS, col: 'col-6' }, { name: 'date', label: 'Date', type: 'date', col: 'col-6' },
      { name: 'notes', label: 'Notes', type: 'textarea', rows: 2 }],
    onSubmit: v => { if (f) { Object.assign(f, v); commit(`Edited food "${v.dish}"`); } else { S.food.push({ id: nid(), created: Date.now(), ...v }); commit(`Logged food "${v.dish}"`); } }
  });
}
function contactForm(c) {
  openForm({
    title: c ? 'Edit contact' : 'Add contact', values: c || {}, fields: [
      { name: 'name', label: 'Name', required: true }, { name: 'role', label: 'Who they are', ph: 'Travel agent, hotel, driver…' },
      { name: 'phone', label: 'Phone', type: 'tel', ph: '+91 98xxxxxxx', col: 'col-6' }, { name: 'whatsapp', label: 'WhatsApp number', type: 'tel', col: 'col-6', help: 'Leave empty to use the phone number.' },
      { name: 'details', label: 'Details', type: 'textarea', rows: 6, ph: 'Address, booking reference, what they handle, payment terms…' }],
    onSubmit: v => { if (c) { Object.assign(c, v); commit(`Edited contact "${v.name}"`); } else { S.contacts.push({ id: nid(), ...v }); commit(`Added contact "${v.name}"`); } }
  });
}
function noteForm(n) {
  openForm({
    title: n ? 'Edit note' : 'Add note', values: n || {}, fields: [{ name: 'title', label: 'Title', required: true }, { name: 'body', label: 'Note', type: 'textarea', rows: 9 }],
    onSubmit: v => { const upd = { ...v, updated: Date.now(), by: myName() }; if (n) { Object.assign(n, upd); commit(`Edited note "${v.title}"`); } else { S.notes.push({ id: nid(), ...upd }); commit(`Added note "${v.title}"`); } }
  });
}
function requestForm(r, priceOnly) {
  const priceFields = [{ name: 'price', label: 'Price', type: 'number', col: 'col-7', required: !!priceOnly }, curSel()];
  openForm({
    title: priceOnly ? `Price for ${r.item}` : r ? 'Edit request' : 'Add request', values: r || { cur: T.destCur }, fields: priceOnly ? priceFields : [
      { name: 'item', label: 'Item', required: true }, { name: 'qty', label: 'Quantity', col: 'col-5' }, { name: 'forWhom', label: 'For', col: 'col-7' },
      ...priceFields, { name: 'note', label: 'Note', type: 'textarea', rows: 2, ph: 'Size, colour, brand, max price…' }],
    onSubmit: v => {
      if (r) { Object.assign(r, v); if (!num(r.price)) r.bought = false; commit(priceOnly ? `Priced "${r.item}" at ${money(v.price, v.cur)}` : `Edited request "${r.item}"`); }
      else { S.requests.push({ id: nid(), bought: false, ...v }); commit(`Added request "${v.item}"`); }
    }
  });
}

const ACT = {
  'signout': async () => { flush(); closeTour(); if (unsubTours) unsubTours(); unsubTours = null; await signOut(auth); location.hash = ''; },
  'new-tour': () => newTourForm(),
  'open-tour': id => { location.hash = `#/tour/${id}`; },
  'go-home': () => { location.hash = '#/'; },
  'tab': (_, el) => showTab(el.dataset.tabLink),
  'dup-tour': id => { const t = TOURS.find(x => x.id === id); if (t) newTourForm({ ...t, name: `${t.name} (copy)`, template: id }); },
  'del-tour': async id => {
    const t = TOURS.find(x => x.id === id) || (T?.id === id ? T : null); if (!t) return;
    if (!await confirmBox('Delete tour?', `Delete <b>${esc(t.name)}</b> for everyone it is shared with? All its data goes too. Export a backup first if you might want it later.`, 'Delete tour')) return;
    if (T?.id === id) { clearTimeout(pushTimer); pushTimer = null; location.hash = '#/'; }
    deleteDoc(doc(db, 'tours', id, 'data', 'state')).catch(e => console.error(e));
    deleteDoc(doc(db, 'tours', id)).then(() => toast('Tour deleted')).catch(e => toast('Could not delete (' + (e.code || e.message) + ')'));
  },
  'leave-tour': async id => {
    const t = TOURS.find(x => x.id === id); if (!t) return;
    if (!await confirmBox('Leave tour?', `You will lose access to <b>${esc(t.name)}</b> until the owner adds you again.`, 'Leave')) return;
    if (T?.id === id) location.hash = '#/';
    updateDoc(doc(db, 'tours', id), { memberEmails: arrayRemove(myEmail()) }).catch(e => toast('Could not leave (' + (e.code || e.message) + ')'));
  },
  'goto-day': id => { localStorage.setItem('tp:day:' + T.id, id); showTab('plan'); },
  'pick-day': id => { localStorage.setItem('tp:day:' + T.id, id); renderActive(); },

  // day plan
  'add-day': () => {
    const last = S.days[S.days.length - 1];
    openForm({
      title: 'Add day', values: { date: last?.date ? addDaysISO(last.date, 1) : '' }, fields: [{ name: 'title', label: 'Day title', ph: 'e.g. Old town walk' }, { name: 'date', label: 'Date', type: 'date' }],
      onSubmit: v => { const d = { id: nid(), steps: [], note: '', ...v }; S.days.push(d); S.days.sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999')); localStorage.setItem('tp:day:' + T.id, d.id); commit(`Added ${dayLabel(d)}`); }
    });
  },
  'edit-day': id => { const d = dayOf(id); openForm({ title: 'Edit day', values: d, fields: [{ name: 'title', label: 'Day title' }, { name: 'date', label: 'Date', type: 'date' }], onSubmit: v => { Object.assign(d, v); S.days.sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999')); commit(`Edited ${dayLabel(d)}`); } }); },
  'del-day': async id => { const d = dayOf(id); if (!await confirmBox('Delete day?', `Delete <b>${esc(dayLabel(d))}</b> with its ${d.steps.length} stops, notes and logged activity?`)) return; const lbl = dayLabel(d); S.days.splice(S.days.indexOf(d), 1); delete S.activity[id]; commit(`Deleted ${lbl}`); },
  'add-step': id => { const d = dayOf(id); openForm({ title: `Add stop, ${dayLabel(d)}`, fields: [{ name: 'time', label: 'Time', ph: '~9:00 AM, Morning, Route…' }, { name: 'text', label: 'Plan', type: 'textarea', required: true }], onSubmit: v => { d.steps.push({ id: nid(), ...v }); commit(`Added a stop to ${dayLabel(d)}`); } }); },
  'edit-step': id => { const { d, s } = findStep(id); openForm({ title: 'Edit stop', values: s, fields: [{ name: 'time', label: 'Time' }, { name: 'text', label: 'Plan', type: 'textarea', required: true }], onSubmit: v => { Object.assign(s, v); commit(`Edited a stop on ${dayLabel(d)}`); } }); },
  'del-step': async id => { const { d, s } = findStep(id); if (!await confirmBox('Delete stop?', esc(s.text))) return; d.steps.splice(d.steps.indexOf(s), 1); commit(`Deleted a stop from ${dayLabel(d)}`); },
  'step-up': id => { const { d, s } = findStep(id); const i = d.steps.indexOf(s); if (i > 0) { [d.steps[i - 1], d.steps[i]] = [d.steps[i], d.steps[i - 1]]; commit(`Reordered ${dayLabel(d)}`); } },

  // activity
  'add-activity': () => { if (!S.days.length) { toast('Add a day first'); return; } activityForm(null, curDayId()); },
  'edit-act': id => { const { dayId, e } = findAct(id); activityForm(e, dayId); },
  'del-act': async id => { const { dayId, a, e } = findAct(id); if (!await confirmBox('Delete entry?', esc(e.text))) return; a.entries.splice(a.entries.indexOf(e), 1); commit(`Deleted an activity on ${dayLabel(dayOf(dayId))}`); },
  'edit-act-title': id => { const a = S.activity[id] || { title: '', entries: [] }; openForm({ title: 'How did the day go?', values: a, fields: [{ name: 'title', label: 'Your own title for this day', ph: 'e.g. Rain all day, still worth it' }], onSubmit: v => { a.title = v.title; S.activity[id] = a; commit(`Renamed ${dayLabel(dayOf(id))} in My activity`); } }); },

  // expenses & budget
  'add-expense': () => expenseForm(),
  'edit-exp': id => expenseForm(byId(S.expenses, id)),
  'del-exp': id => delFrom(S.expenses, id, e => e.item, e => `Deleted expense "${e.item}"`),
  'add-budget': (id) => {
    const b = id ? byId(S.budget, id) : null;
    openForm({
      title: b ? 'Edit budget item' : 'Add budget item', values: b || { cur: T.destCur, category: 'Transport' }, fields: [
        { name: 'item', label: 'Item', required: true, ph: 'e.g. Hotel, 3 nights' }, { name: 'category', label: 'Category', type: 'select', options: CATS },
        { name: 'min', label: 'Cost (or lowest)', type: 'number', required: true, col: 'col-6' }, { name: 'max', label: 'Highest', type: 'number', col: 'col-6' }, curSel(), { name: 'note', label: 'Note', col: 'col-7' }],
      onSubmit: v => { if (v.max !== '' && v.max < v.min) return 'Highest is below the lowest cost.'; if (b) { Object.assign(b, v); commit(`Edited budget item "${v.item}"`); } else { S.budget.push({ id: nid(), ...v }); commit(`Added budget item "${v.item}"`); } }
    });
  },
  'edit-bud': id => ACT['add-budget'](id),
  'del-bud': id => delFrom(S.budget, id, b => b.item, b => `Deleted budget item "${b.item}"`),

  // places / food / requests
  'add-place': () => placeForm(), 'edit-place': id => placeForm(byId(S.places, id)),
  'del-place': id => delFrom(S.places, id, p => p.name, p => `Deleted place "${p.name}"`),
  'place-filter': id => { placeFilter = id; renderActive(); },
  'add-food': () => foodForm(), 'edit-food': id => foodForm(byId(S.food, id)),
  'del-food': id => delFrom(S.food, id, f => f.dish, f => `Deleted food "${f.dish}"`),
  'add-req': () => requestForm(), 'edit-req': id => requestForm(byId(S.requests, id)), 'price-req': id => requestForm(byId(S.requests, id), true),
  'del-req': id => delFrom(S.requests, id, r => r.item, r => `Deleted request "${r.item}"`),

  'add-list': () => openForm({ title: 'New list', fields: [{ name: 'name', label: 'List name', required: true }, { name: 'priced', label: 'Track prices on this list (kept out of trip totals)', type: 'check' }], onSubmit: v => { S.lists.push({ id: nid(), items: [], ...v }); commit(`Created list "${v.name}"`); } }),
  'edit-list': id => { const l = byId(S.lists, id); openForm({ title: 'Edit list', values: l, fields: [{ name: 'name', label: 'List name', required: true }, { name: 'priced', label: 'Track prices on this list (kept out of trip totals)', type: 'check' }], onSubmit: v => { Object.assign(l, v); commit(`Edited list "${v.name}"`); } }); },
  'del-list': id => delFrom(S.lists, id, l => `${l.name} (${l.items.length} items)`, l => `Deleted list "${l.name}"`),
  'clear-done': async id => { const l = byId(S.lists, id), n = l.items.filter(i => i.done).length; if (!await confirmBox('Remove ticked items?', `Remove ${n} ticked item${n > 1 ? 's' : ''} from <b>${esc(l.name)}</b>?`, 'Remove')) return; l.items = l.items.filter(i => !i.done); commit(`Removed ${n} ticked items from "${l.name}"`); },
  'edit-item': (id, el) => {
    const l = byId(S.lists, el.dataset.list), i = byId(l.items, id);
    openForm({ title: 'Edit item', values: { ...i, cur: i.cur || T.homeCur }, fields: [{ name: 'text', label: 'Item', required: true }, ...(l.priced ? [{ name: 'price', label: 'Price', type: 'number', col: 'col-7' }, curSel()] : [])], onSubmit: v => { Object.assign(i, v); commit(`Edited "${v.text}" in "${l.name}"`); } });
  },
  'del-item': (id, el) => { const l = byId(S.lists, el.dataset.list), i = byId(l.items, id); l.items.splice(l.items.indexOf(i), 1); commit(`Removed "${i.text}" from "${l.name}"`); },

  // contacts & notes
  'add-contact': () => contactForm(), 'edit-contact': id => contactForm(byId(S.contacts, id)),
  'del-contact': id => delFrom(S.contacts, id, c => c.name, c => `Deleted contact "${c.name}"`),
  'contact-details': id => { const c = byId(S.contacts, id); infoBox(c.name, `${c.role ? `<p class="dim">${esc(c.role)}</p>` : ''}${c.phone ? `<p><i class="bi bi-telephone me-1"></i>${esc(c.phone)}</p>` : ''}<div style="white-space:pre-wrap">${esc(c.details)}</div>`, `<button class="btn btn-ghost" data-action="copy" data-copy="${esc(`${c.name}\n${c.phone || ''}\n${c.details || ''}`)}">Copy all</button>`); },
  'copy': (_, el) => copyText(el.dataset.copy),
  'add-note': () => noteForm(), 'edit-note': id => noteForm(byId(S.notes, id)),
  'view-note': id => { const n = byId(S.notes, id); infoBox(n.title, `<div style="white-space:pre-wrap">${esc(n.body)}</div>`, `<button class="btn btn-ghost" data-action="copy" data-copy="${esc(n.body)}">Copy</button>`); },
  'del-note': id => delFrom(S.notes, id, n => n.title, n => `Deleted note "${n.title}"`),

  'cv-refresh': async () => { try { await fetchRates(true); toast('Rates updated'); renderActive(); } catch { toast('Could not reach the rate service'); } },

    try { await fetchRates(); const r = liveRate(T.destCur, T.homeCur); if (!r) { toast(`No live rate for ${T.destCur}`); return; }
      await updateDoc(tourRef, { rate: round(r) }); addLog(`Set the tour rate to 1 ${T.destCur} = ${round(r)} ${T.homeCur}`); schedulePush(); toast('Tour rate updated'); }
    catch (e) { toast('Could not update rate (' + (e.code || e.message) + ')'); }
  },
